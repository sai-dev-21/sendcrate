<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Private, temporary file sharing.">
  <title>SendCrate — temporary file sharing</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">SendCrate</a>
    <span class="badge">self-hosted</span>
  </header>

  <main class="shell">
    <section class="hero">
      <p class="eyebrow">TEMPORARY FILE SHARING</p>
      <h1>Send a file.<br><span>Forget the file.</span></h1>
      <p class="lead">Create a private link that expires when you choose. No account needed for the person downloading it.</p>
    </section>

    <section class="dropzone" id="dropzone">
      <input id="fileInput" type="file" multiple hidden>
      <div class="drop-icon">↑</div>
      <h2>Drop files here</h2>
      <p>or <button id="chooseButton" class="text-button">choose from your device</button></p>
      <small id="limitText"></small>
    </section>

    <section class="options">
      <label>
        <span>Expires</span>
        <select id="expires">
          <option value="30m">30 minutes</option>
          <option value="2h">2 hours</option>
          <option value="24h" selected>24 hours</option>
          <option value="7d">7 days</option>
          <option value="30d">30 days</option>
        </select>
      </label>

      <label>
        <span>Downloads</span>
        <select id="downloads">
          <option value="">Unlimited</option>
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="10">10</option>
        </select>
      </label>

      <label>
        <span>Password</span>
        <input id="password" type="password" placeholder="Optional">
      </label>

      <label class="check">
        <input id="burn" type="checkbox">
        <span>Burn after download</span>
      </label>

      <label class="check">
        <input id="encrypt" type="checkbox" checked>
        <span>Encrypt in browser</span>
      </label>
    </section>

    <section id="fileList" class="file-list"></section>

    <button id="uploadButton" class="primary" disabled>Create secure link</button>

    <section id="result" class="result hidden"></section>

    <p id="status" class="status"></p>
  </main>

  <footer>MIT licensed · no tracking · self-host it</footer>

  <script src="/app.js" type="module"></script>
</body>
</html>
